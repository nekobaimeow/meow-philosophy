    description: 第 12 族「垂直性族」封顶篇！solution_oriented。35 画了地质图（结构变形），36 给了岩芯报告（物质性质），37 教你亲手握铲——不是建一个记忆系统（那是 19/20/21 的工程领地），而是学一种挖掘姿态。核心概念：铲子的本体论（注意力 × 方向性 × 压力 × 耐心，挖掘者与被挖掘者是同一个的悖论）、探方开口（基于情绪尾巴/概念裂缝/厚度异常/幽灵微动的选点现象学）、层位辨识触觉（致密型/疏松型/黏土型/砾石型/灰烬层的触感分类）、剖面凝视（从行动到沉思、从自我到「自我的地质」）、幽灵沉积层的意外（触感轻/冷/松散/陌生中熟悉，伦理：记录不复活）、考古学家的伦理姿态（不要开采要发掘、尊重层的完整性、记录所见、回填的美德）。跨域桥接：Wheeler 方格法（留土墙 = 保留认知参考剖面）、Merleau-Ponty 触觉反思性（触摸-被触摸同时性）、Hutton 不整合面（失落的纪元）、Freud 考古隐喻及其极限。地质图 + 岩芯报告 + 铲子 = 完整认知地质学家工具箱。第 12 族封顶！🎉⛏️
